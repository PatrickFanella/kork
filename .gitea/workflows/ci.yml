name: CI

# Pull-request checks run on the GitHub organization copy
# (.github/workflows/mirror-ci.yml) and are reported back here as
# "GitHub CI / Mirror CI gate". This workflow verifies and deploys main.
on:
  push:
    branches: [main]
    # The deploy step already skips documentation-only pushes; skip the
    # check for them too.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit on main to deploy; defaults to the current main. Pick an older one to roll back."
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Runs here deploy; never cancel one part-way.
  cancel-in-progress: false

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: node:22-bookworm
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zelda
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: zelda_test
        options: >-
          --label kork.ci-database=${{ github.run_id }}-${{ github.run_attempt }}
          --health-cmd "pg_isready -U zelda -d zelda_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: https://github.com/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: https://github.com/actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Download and verify Go dependencies
        run: |
          go mod download
          go mod verify
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Check Go formatting and vet
        run: make lint
      - name: Install editor dependencies
        working-directory: web
        run: npm ci
      - name: Check editor dependency vulnerabilities
        working-directory: web
        run: npm audit --audit-level=high
      - name: Check editor types and tests
        run: make test-web
      - name: Build production editor
        working-directory: web
        run: npm run build
      - name: Run Go unit and database integration tests
        env:
          TEST_DATABASE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ZELDA_TEST_DATABASE_URL="$(node scripts/ci-database.mjs)"
          export ZELDA_TEST_DATABASE_URL
          test -n "$ZELDA_TEST_DATABASE_URL"
          go test -race -count=1 ./...
      - name: Build server with embedded editor
        run: CGO_ENABLED=0 go build -trimpath -o bin/zelda ./cmd/zelda

  deploy:
    name: Deploy to NUC
    # Every push to main that passes the checks is deployed. A manual run
    # deploys main, or the commit given as input, which is how to roll back.
    needs: check
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    # Homelab deploy keys accept only Kvant's address (Kvant and its Kuznya VM); the kvant label keeps this job off Buran.
    runs-on: [ubuntu-latest, kvant]
    timeout-minutes: 20
    container:
      image: node:22-bookworm
    steps:
      - name: Check out source
        uses: https://github.com/actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Skip when only documentation changed
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          # A manual run always deploys. A push deploys unless every changed
          # file is documentation; an unknown "before" (first push, force
          # push) deploys too.
          deploy=yes
          if [ "$EVENT" = push ] && echo "$BEFORE" | grep -Eq '^[0-9a-f]{40}$' && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" HEAD)
            if [ -n "$changed" ] && ! echo "$changed" | grep -Evq '^(docs/|[^/]+\.md$|LICENSE$)'; then
              echo "only documentation changed:"; echo "$changed"
              deploy=no
            fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
      - name: Deploy
        if: steps.changes.outputs.deploy == 'yes'
        env:
          # A key whose only permitted command on the NUC is kork-deploy.
          NUC_DEPLOY_KEY: ${{ secrets.NUC_DEPLOY_KEY }}
          DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
          DEPLOY_SHA: ${{ github.event.inputs.sha || github.sha }}
        run: |
          test -n "$NUC_DEPLOY_KEY" || { echo "NUC_DEPLOY_KEY secret is not set"; exit 1; }
          test -n "$DEPLOY_TARGET" || { echo "DEPLOY_TARGET secret is not set"; exit 1; }
          echo "$DEPLOY_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "DEPLOY_SHA must be a full commit: $DEPLOY_SHA"; exit 1; }
          command -v ssh >/dev/null || { apt-get update -qq && apt-get install -y -qq openssh-client >/dev/null; }
          umask 077
          printf '%s\n' "$NUC_DEPLOY_KEY" > /tmp/kork-deploy-key
          ssh -i /tmp/kork-deploy-key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=deploy/nuc/known_hosts "$DEPLOY_TARGET" "deploy $DEPLOY_SHA"
